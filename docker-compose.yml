services:
  api:
    build:
      context: ./backend
    container_name: mia-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://mia:mia_password@postgres:5432/mia
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
    container_name: mia-worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://mia:mia_password@postgres:5432/mia
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A core.celery_app.celery_app worker --loglevel=info

  beat:
    build:
      context: ./backend
    container_name: mia-beat
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://mia:mia_password@postgres:5432/mia
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - redis
    volumes:
      - ./backend:/app
    command: celery -A core.celery_app.celery_app beat --loglevel=info

  frontend:
    build:
      context: ./frontend
    container_name: mia-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_SOCKET_URL: http://localhost:8000
    depends_on:
      - api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

  postgres:
    image: postgres:16-alpine
    container_name: mia-postgres
    environment:
      POSTGRES_USER: mia
      POSTGRES_PASSWORD: mia_password
      POSTGRES_DB: mia
    ports:
      - "5432:5432"
    volumes:
      - mia-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mia"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mia-redis
    ports:
      - "6379:6379"
    volumes:
      - mia-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mia-pgdata:
  mia-redisdata:

